name: 🚀 Suggest a project
description: Suggest an open source project to add
labels: ["new-project"]
body:
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository URL
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category (e.g. AI / ML / LLM)
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What does it do and why does it belong here?
    validations:
      required: true
