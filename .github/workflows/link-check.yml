name: Link check
on:
  pull_request:
    paths: ["**.md"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --accept 200,429 --exclude img.shields.io --exclude star-history README.md
          fail: ${{ github.event_name == 'pull_request' }}
          issue-labels: maintenance
